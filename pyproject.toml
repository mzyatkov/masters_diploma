[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-failure-bayesian-econ"
version = "0.1.0"
description = "Bayesian-style uncertainty for disk failure prediction with economic risk optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "catboost>=1.2",
    "lifelines>=0.27",
    "pymoo>=0.6",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ipykernel>=6.29", "jupyter>=1.0"]

[tool.setuptools]
packages = ["src", "src.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
